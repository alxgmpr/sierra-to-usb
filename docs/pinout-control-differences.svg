<text x="80" y="1288" font-size="19" font-weight="700" fill="#0f172a">What the colors mean</text>
<text class="note" x="80" y="1317">Red = power / voltage conflict  ·  Orange = host identification  ·  Amber = unmatched control  ·  Blue = behavior differs  ·  Green = same role</text>
<text class="note" x="80" y="1346">Common USB / PCIe data pairs and SIM data pins are omitted here. This is a control and conflict map, not a complete wiring diagram.</text>
<text class="foot" x="62" y="1403">Sources: Semtech/Sierra EM92xx Product Technical Specification, Rev. 3 (May 2024), Table 2-1 pp. 19-24;</text>
<text class="foot" x="62" y="1426">Tables 2-3, 2-7 through 2-9, 2-13, and §2.7. Quectel RM520N-GL Hardware Design V1.0 (July 2022),</text>
<text class="foot" x="62" y="1449">Figure 2 p. 18; Table 5 pp. 19-23; Tables 8, 11, 27-28 and §§4.4, 4.6.</text>
<text class="foot" x="62" y="1472">“RESERVED” means follow that vendor’s instruction to leave the pin unconnected; optional pins are marked * in Quectel’s document.</text>
